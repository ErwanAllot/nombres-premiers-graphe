<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphe Nombres Premiers - Moteur Modulaire</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Zone d'affichage graphique -->
    <canvas id="grilleCanvas"></canvas>

    <!-- Interface de contrôle (boutons d'historique et de navigation) -->
    <div id="panneau-controle">
        <div class="groupe-boutons">
            <button id="btn-debut" title="Aller au début">Début</button>
            <button id="btn-precedent" title="Étape précédente">◀ Précédent</button>
            <span id="indicateur-etape">Étape : 0 / 0</span>
            <button id="btn-suivant" title="Étape suivante">Suivant ▶</button>
            <button id="btn-fin" title="Aller à la fin">Fin</button>
        </div>
        <div class="groupe-boutons">
            <!-- Ajout de l'indicateur de coordonnées -->
            <span id="coord-souris" style="padding: 0 10px; font-family: monospace;">X: 0 | Y: 0</span>
            
            <button id="btn-exporter-json" title="Sauvegarder l'état (JSON)">Exporter JSON</button>
            <label for="input-importer-json" class="bouton-fichier">Importer JSON</label>
            <input type="file" id="input-importer-json" accept=".json" style="display: none;">
        </div>
    </div>

    <!-- Chargement séquentiel des modules (ordre des dépendances strict) -->
<!-- 1. Les modèles de données (structures brutes) -->
    <script src="js/modeles/epingle.js"></script>
    <script src="js/modeles/chemin.js"></script>

    <!-- 2. Les mathématiques et la logique pure -->
    <script src="js/mathematiques/premiers.js"></script>
    <script src="js/mathematiques/geometrie.js"></script>

    <!-- 3. Le rendu graphique (utilise les modèles et les mathématiques) -->
    <script src="js/rendu/grille.js"></script>
    <script src="js/rendu/epingle.js"></script>
    <script src="js/rendu/chemin.js"></script>

    <!-- 4. Les interactions (souris, UI, etc.) -->
    <script src="js/interactions/souris.js"></script>
    <script src="js/interactions/btn.js"></script>
    <!-- <script src="js/interactions/ui.js"></script> -->

    <!-- 5. Les outils transverses -->
    <script src="js/historique.js"></script>

    <script src="js/scenario.js?v=999"></script>

    <!-- 7. Le script principal / chef d'orchestre (toujours en dernier) -->
    <script src="js/script.js"></script>
</body>
</html>
